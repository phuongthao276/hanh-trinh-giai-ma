
<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Hoàng Tử Giải Cứu Công Chúa</title>
<style>
*{box-sizing:border-box}
body{margin:0;overflow:hidden;font-family:Arial;background:#91c9dd}
#game{width:100vw;height:100dvh}
canvas{display:block}
#mobile{
 position:fixed;inset:auto 18px 22px;
 display:flex;justify-content:space-between;align-items:end;
 pointer-events:none;z-index:5
}
.pad{display:grid;grid-template-columns:58px 58px 58px;grid-template-rows:58px 58px;gap:5px}
.control{
 width:58px;height:58px;border-radius:50%;
 border:2px solid #ffffffaa;background:#ffffff35;
 backdrop-filter:blur(5px);touch-action:none;pointer-events:auto
}
#left{grid-column:1;grid-row:1}
#right{grid-column:3;grid-row:1}
#forward{grid-column:2;grid-row:1}
#back{grid-column:2;grid-row:2}
#jump{width:76px;height:76px;margin-bottom:10px}
#quiz,#ending{
 display:none;position:fixed;inset:0;background:#0009;
 align-items:center;justify-content:center;z-index:10
}
.panel{
 background:#fff8ec;border-radius:22px;padding:25px;
 width:min(90%,420px);text-align:center;color:#49382d
}
.answer{
 display:block;width:100%;padding:14px;margin:9px 0;
 border:0;border-radius:12px;background:#ead8b9;
 font-size:16px
}
#status{
 position:fixed;top:12px;left:12px;color:white;
 background:#233c38aa;padding:10px 15px;
 border-radius:12px;z-index:3
}
#toast{
 position:fixed;top:65px;left:50%;transform:translateX(-50%);
 color:white;text-shadow:0 2px 5px #333;z-index:3;
 text-align:center
}
@media(pointer:fine){#mobile{display:none}}
</style>
</head>
<body>
<div id="game"></div>
<div id="status">Màn <span id="level">1</span>/5</div>
<div id="toast"></div>

<div id="mobile">
 <div class="pad">
  <button class="control" id="left"></button>
  <button class="control" id="forward"></button>
  <button class="control" id="right"></button>
  <button class="control" id="back"></button>
 </div>
 <button class="control" id="jump"></button>
</div>

<div id="quiz">
 <div class="panel">
  <h2 id="subject"></h2>
  <h3 id="question"></h3>
  <div id="answers"></div>
  <p id="feedback"></p>
 </div>
</div>

<div id="ending">
 <div class="panel">
  <h1>Giải cứu thành công!</h1>
  <p>Hoàng tử và công chúa đã đoàn tụ.</p>
  <button class="answer" onclick="location.reload()">Chơi lại</button>
 </div>
</div>

<script type="importmap">
{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js"}}
</script>
<script type="module">
import * as THREE from "three";

const scene=new THREE.Scene();
scene.background=new THREE.Color(0x9edaf0);
scene.fog=new THREE.Fog(0x9edaf0,25,65);

const camera=new THREE.PerspectiveCamera(65,innerWidth/innerHeight,.1,100);
const renderer=new THREE.WebGLRenderer({antialias:true});
renderer.setSize(innerWidth,innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio,1.7));
renderer.shadowMap.enabled=true;
renderer.shadowMap.type=THREE.PCFSoftShadowMap;
document.getElementById("game").appendChild(renderer.domElement);

scene.add(new THREE.HemisphereLight(0xffffff,0x55734d,2));
const sun=new THREE.DirectionalLight(0xffffff,2.2);
sun.position.set(-8,15,10);
sun.castShadow=true;
scene.add(sun);

const mat=c=>new THREE.MeshStandardMaterial({color:c});
function cube(parent,w,h,d,color,x,y,z){
 const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),mat(color));
 m.position.set(x,y,z);m.castShadow=true;m.receiveShadow=true;
 parent.add(m);return m;
}
function ball(parent,r,color,x,y,z){
 const m=new THREE.Mesh(new THREE.SphereGeometry(r,20,16),mat(color));
 m.position.set(x,y,z);m.castShadow=true;parent.add(m);return m;
}

/* Hoàng tử */
const prince=new THREE.Group();scene.add(prince);
const character=new THREE.Group();prince.add(character);
cube(character,.55,.8,.35,0x2856b5,0,1.1,0);
cube(character,.65,.9,.13,0x922e45,0,1.05,.23);
cube(character,.2,.65,.22,0xffd0a4,-.39,1.05,0);
cube(character,.2,.65,.22,0xffd0a4,.39,1.05,0);
cube(character,.22,.65,.25,0x27375e,-.16,.34,0);
cube(character,.22,.65,.25,0x27375e,.16,.34,0);
ball(character,.31,0xffd1aa,0,1.82,0);
ball(character,.32,0x593923,0,2.02,-.03);
cube(character,.4,.12,.34,0xffd447,0,2.15,0);
for(let i=-1;i<=1;i++)
 cube(character,.1,.2,.1,0xffd447,i*.14,2.28,0);

/* Màn chơi */
const data=[
 {name:"Ngôi làng",ground:0x83bf76,sky:0x9edaf0,leaf:0x438b4c},
 {name:"Khu rừng",ground:0x477a50,sky:0x8ab7a0,leaf:0x235a36},
 {name:"Nhà phù thủy",ground:0x696083,sky:0xa79ac3,leaf:0x55406c},
 {name:"Cung điện",ground:0xc9aa7f,sky:0xa9d7ed,leaf:0x55965c},
 {name:"Lâu đài",ground:0x858392,sky:0x687994,leaf:0x344b48}
];

const questions=[
 ["Toán học","15 × 4 bằng bao nhiêu?",["45","60","75"],1],
 ["Khoa học","Hành tinh gần Mặt Trời nhất?",["Sao Kim","Sao Hỏa","Sao Thủy"],2],
 ["Tiếng Anh","Beautiful nghĩa là gì?",["Xinh đẹp","Thông minh","Nhanh nhẹn"],0],
 ["Ngữ văn","Ai là nhân vật chính trong truyện Tấm Cám?",["Cám","Tấm","Bà lão"],1],
 ["Địa lý","Thủ đô Việt Nam là thành phố nào?",["Huế","Đà Nẵng","Hà Nội"],2]
];

let level=0,world=new THREE.Group(),obstacles=[],gate;
const gateZ=-25;

function tree(x,z,color){
 const g=new THREE.Group();
 const trunk=new THREE.Mesh(new THREE.CylinderGeometry(.18,.24,1.4,8),mat(0x795137));
 trunk.position.y=.7;g.add(trunk);
 const leaf=new THREE.Mesh(new THREE.ConeGeometry(.95,2.3,9),mat(color));
 leaf.position.y=2.2;g.add(leaf);
 g.position.set(x,0,z);world.add(g);
}
function obstacle(x,z,color){
 const m=cube(world,1.5,1.1,1,color,x,.55,z);
 obstacles.push({x,z});
}
function build(){
 scene.remove(world);world=new THREE.Group();scene.add(world);
 obstacles=[];
 const d=data[level];
 scene.background.set(d.sky);scene.fog.color.set(d.sky);
 const floor=new THREE.Mesh(new THREE.BoxGeometry(26,.5,65),mat(d.ground));
 floor.position.set(0,-.3,-10);floor.receiveShadow=true;world.add(floor);
 cube(world,7,.08,60,0xd1bd9c,0,-.01,-10);

 for(let z=7;z>-37;z-=5){
  tree(-9,z,d.leaf);tree(9,z,d.leaf);
 }
 obstacle(-1.8,-4,0x94704e);
 obstacle(1.8,-10,0x987552);
 obstacle(-1.5,-16,0x99734f);

 cube(world,.5,4,.5,0x9b7943,-2,2,gateZ);
 cube(world,.5,4,.5,0x9b7943,2,2,gateZ);
 cube(world,4.5,.5,.5,0xd5b05b,0,4,gateZ);
 gate=cube(world,3.5,3.5,.3,0x71492d,0,1.75,gateZ);

 if(level===4){
  const princess=new THREE.Group();
  ball(princess,.3,0xffd1aa,0,1.9,0);
  ball(princess,.32,0x754329,0,2.12,-.02);
  cube(princess,.7,1,.4,0xe98bb0,0,1,0);
  cube(princess,.45,.13,.35,0xffd447,0,2.32,0);
  princess.position.set(0,0,-29);world.add(princess);
 }
 prince.position.set(0,0,9);
 document.getElementById("level").textContent=level+1;
 document.getElementById("toast").textContent=d.name;
}
build();

/* Điều khiển */
const keys={};
addEventListener("keydown",e=>{
 keys[e.code]=true;
 if(e.code==="Space")e.preventDefault();
 if(e.code==="KeyE")interact();
});
addEventListener("keyup",e=>keys[e.code]=false);

const touchMap={
 left:"KeyA",right:"KeyD",forward:"KeyW",back:"KeyS",jump:"Space"
};
Object.entries(touchMap).forEach(([id,key])=>{
 const b=document.getElementById(id);
 b.addEventListener("pointerdown",e=>{
  e.preventDefault();keys[key]=true;b.setPointerCapture(e.pointerId);
 });
 const release=()=>keys[key]=false;
 b.addEventListener("pointerup",release);
 b.addEventListener("pointercancel",release);
 b.addEventListener("lostpointercapture",release);
});

let vy=0,jumping=false;
function blocked(x,z,y){
 if(y>1.35)return false;
 return obstacles.some(o=>Math.abs(x-o.x)<1.2&&Math.abs(z-o.z)<1);
}
function move(dt){
 const s=7*dt;
 let dx=0,dz=0;
 if(keys.KeyW||keys.ArrowUp)dz-=s;
 if(keys.KeyS||keys.ArrowDown)dz+=s;
 if(keys.KeyA||keys.ArrowLeft)dx-=s;
 if(keys.KeyD||keys.ArrowRight)dx+=s;
 let nx=THREE.MathUtils.clamp(prince.position.x+dx,-5,5);
 let nz=THREE.MathUtils.clamp(prince.position.z+dz,-30,12);
 if(!blocked(nx,prince.position.z,prince.position.y))prince.position.x=nx;
 if(!blocked(prince.position.x,nz,prince.position.y))prince.position.z=nz;
 if(keys.Space&&!jumping){vy=9;jumping=true;}
 vy-=23*dt;prince.position.y+=vy*dt;
 if(prince.position.y<0){prince.position.y=0;vy=0;jumping=false;}
 if(dx||dz)character.rotation.y=Math.atan2(-dx,-dz);
}

function interact(){
 if(document.getElementById("quiz").style.display==="flex")return;
 if(Math.abs(prince.position.z-gateZ)<3)openQuiz();
}
function openQuiz(){
 const q=questions[level];
 document.getElementById("subject").textContent=q[0];
 document.getElementById("question").textContent=q[1];
 document.getElementById("feedback").textContent="";
 const area=document.getElementById("answers");area.innerHTML="";
 q[2].forEach((a,i)=>{
  const b=document.createElement("button");b.className="answer";b.textContent=a;
  b.onclick=()=>answer(i);area.appendChild(b);
 });
 document.getElementById("quiz").style.display="flex";
}
function answer(i){
 const q=questions[level];
 if(i!==q[3]){
  document.getElementById("feedback").textContent="Chưa đúng, thử lại nhé!";
  return;
 }
 document.getElementById("feedback").textContent="Chính xác! Cổng đã mở.";
 gate.visible=false;
 setTimeout(()=>{
  document.getElementById("quiz").style.display="none";
  if(level===4)document.getElementById("ending").style.display="flex";
  else{level++;build();}
 },900);
}

/* Camera và hoạt ảnh */
const clock=new THREE.Clock();
function animate(){
 requestAnimationFrame(animate);
 const dt=Math.min(clock.getDelta(),.04);
 if(document.getElementById("quiz").style.display!=="flex"&&
 document.getElementById("ending").style.display!=="flex")move(dt);

 const target=new THREE.Vector3(
 prince.position.x,prince.position.y+4,prince.position.z+8
 );
 camera.position.lerp(target,.09);
 camera.lookAt(prince.position.x,prince.position.y+1.3,prince.position.z-3);
 renderer.render(scene,camera);
}
animate();

addEventListener("resize",()=>{
 camera.aspect=innerWidth/innerHeight;
 camera.updateProjectionMatrix();
 renderer.setSize(innerWidth,innerHeight);
});
</script>
</body>
</html>
