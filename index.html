
<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chàng Hoàng Tử Giải Cứu Công Chúa</title>

<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  overflow: hidden;
  font-family: Arial, sans-serif;
  background: #182333;
}

#game {
  width: 100vw;
  height: 100vh;
}

#info {
  position: absolute;
  top: 12px;
  left: 12px;
  color: white;
  background: #172536dd;
  padding: 12px 18px;
  border-radius: 10px;
  line-height: 1.7;
}

#controls {
  position: absolute;
  bottom: 15px;
  left: 50%;
  transform: translateX(-50%);
  color: white;
  background: #172536dd;
  padding: 12px 20px;
  border-radius: 10px;
  text-align: center;
}

#quiz, #ending {
  display: none;
  position: absolute;
  inset: 0;
  background: #000a;
  align-items: center;
  justify-content: center;
}

.panel {
  background: white;
  padding: 25px;
  width: 90%;
  max-width: 430px;
  border-radius: 16px;
  text-align: center;
}

.answer {
  display: block;
  width: 100%;
  padding: 13px;
  margin: 10px 0;
  border: 1px solid #aaa;
  border-radius: 8px;
  background: white;
  font-size: 16px;
  cursor: pointer;
}

.answer:hover {
  background: #e8f0ff;
}

#message {
  color: #176b39;
  font-weight: bold;
}

#hint {
  position: absolute;
  bottom: 95px;
  width: 100%;
  text-align: center;
  color: white;
  text-shadow: 1px 1px 4px black;
}
</style>
</head>

<body>

<div id="game"></div>

<div id="info">
  <b>CHÀNG HOÀNG TỬ GIẢI CỨU CÔNG CHÚA</b><br>
  Màn: <span id="level">1</span>/5<br>
  Nhiệm vụ: Vượt thử thách và mở cổng
</div>

<div id="hint">Dùng W A S D để di chuyển</div>

<div id="controls">
  W A S D: Di chuyển |
  SPACE: Nhảy |
  E: Tương tác
</div>

<div id="quiz">
  <div class="panel">
    <h2 id="question-title">Câu hỏi</h2>
    <p id="question"></p>
    <div id="answers"></div>
    <p id="message"></p>
  </div>
</div>

<div id="ending">
  <div class="panel">
    <h1>Giải cứu thành công!</h1>
    <p>Hoàng tử đã tìm được công chúa.</p>
    <p>Hai người đã đoàn tụ. Cảm ơn bạn đã chơi!</p>
    <button class="answer" onclick="location.reload()">
      Chơi lại
    </button>
  </div>
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js"
  }
}
</script>

<script type="module">
import * as THREE from "three";

/* KHỞI TẠO GAME */

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x9ed9ed);
scene.fog = new THREE.Fog(0x9ed9ed, 30, 65);

const camera = new THREE.PerspectiveCamera(
  65,
  window.innerWidth / window.innerHeight,
  0.1,
  100
);

const renderer = new THREE.WebGLRenderer({
  antialias: true
});

renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.getElementById("game").appendChild(renderer.domElement);

/* ÁNH SÁNG */

scene.add(new THREE.HemisphereLight(0xffffff, 0x607050, 2));

const sun = new THREE.DirectionalLight(0xffffff, 2);
sun.position.set(8, 15, 8);
sun.castShadow = true;
scene.add(sun);

/* TẠO VẬT LIỆU */

function material(color) {
  return new THREE.MeshStandardMaterial({ color });
}

function box(w, h, d, color, x, y, z, parent) {
  const mesh = new THREE.Mesh(
    new THREE.BoxGeometry(w, h, d),
    material(color)
  );
  mesh.position.set(x, y, z);
  mesh.castShadow = true;
  mesh.receiveShadow = true;
  parent.add(mesh);
  return mesh;
}

function sphere(r, color, x, y, z, parent) {
  const mesh = new THREE.Mesh(
    new THREE.SphereGeometry(r, 20, 16),
    material(color)
  );
  mesh.position.set(x, y, z);
  mesh.castShadow = true;
  parent.add(mesh);
  return mesh;
}

/* NHÂN VẬT HOÀNG TỬ */

const prince = new THREE.Group();
scene.add(prince);

const body = new THREE.Group();
prince.add(body);

// Chân
box(0.23, 0.65, 0.28, 0x263c79, -0.17, 0.35, 0, body);
box(0.23, 0.65, 0.28, 0x263c79, 0.17, 0.35, 0, body);

// Thân áo
box(0.65, 0.85, 0.35, 0x2255b5, 0, 1.12, 0, body);

// Áo choàng
box(0.7, 1.0, 0.13, 0x9c263d, 0, 1.1, 0.25, body);

// Đầu
sphere(0.32, 0xffd0a3, 0, 1.85, 0, body);

// Tóc
sphere(0.33, 0x59351f, 0, 2.05, -0.03, body);

// Vương miện
box(0.42, 0.12, 0.35, 0xffd447, 0, 2.18, 0, body);

// Tay
box(0.22, 0.75, 0.25, 0xffd0a3, -0.45, 1.1, 0, body);
box(0.22, 0.75, 0.25, 0xffd0a3, 0.45, 1.1, 0, body);

/* CÁC MÀN CHƠI */

const levels = [
  {
    name: "Ngôi làng",
    ground: 0x78ba69,
    sky: 0x9ed9ed,
    tree: 0x438c49,
    obstacle: 0x98734c
  },
  {
    name: "Khu rừng bí ẩn",
    ground: 0x477d50,
    sky: 0x8cb9a3,
    tree: 0x205a39,
    obstacle: 0x76523c
  },
  {
    name: "Nhà phù thủy",
    ground: 0x554c76,
    sky: 0x9a8cb8,
    tree: 0x45395e,
    obstacle: 0x6a4d82
  },
  {
    name: "Cung điện",
    ground: 0xc4a77c,
    sky: 0x9ccde9,
    tree: 0x4b9563,
    obstacle: 0xc39a55
  },
  {
    name: "Lâu đài",
    ground: 0x85818e,
    sky: 0x65728f,
    tree: 0x344b48,
    obstacle: 0x55515e
  }
];

const questions = [
  {
    title: "Toán học",
    q: "15 × 4 bằng bao nhiêu?",
    a: ["45", "60", "75"],
    correct: 1
  },
  {
    title: "Khoa học tự nhiên",
    q: "Hành tinh nào gần Mặt Trời nhất?",
    a: ["Sao Kim", "Sao Hỏa", "Sao Thủy"],
    correct: 2
  },
  {
    title: "Tiếng Anh",
    q: "Từ 'Beautiful' có nghĩa là gì?",
    a: ["Xinh đẹp", "Thông minh", "Nhanh nhẹn"],
    correct: 0
  },
  {
    title: "Ngữ văn",
    q: "Ai là nhân vật chính trong truyện Tấm Cám?",
    a: ["Cám", "Tấm", "Bà lão"],
    correct: 1
  },
  {
    title: "Lịch sử và Địa lý",
    q: "Thủ đô của Việt Nam là thành phố nào?",
    a: ["Huế", "Đà Nẵng", "Hà Nội"],
    correct: 2
  }
];

let level = 0;
let levelGroup = new THREE.Group();
scene.add(levelGroup);

let obstacles = [];
let gate;
let gatePosition = -24;

/* TẠO CÂY */

function makeTree(x, z, color) {
  const tree = new THREE.Group();

  const trunk = new THREE.Mesh(
    new THREE.CylinderGeometry(0.18, 0.23, 1.5, 8),
    material(0x765034)
  );
  trunk.position.y = 0.75;
  tree.add(trunk);

  const leaves = new THREE.Mesh(
    new THREE.ConeGeometry(0.9, 2.3, 8),
    material(color)
  );
  leaves.position.y = 2.2;
  tree.add(leaves);

  tree.position.set(x, 0, z);
  levelGroup.add(tree);
}

/* TẠO CHƯỚNG NGẠI VẬT */

function makeObstacle(x, z, color) {
  const obstacle = box(
    1.5, 1.15, 1,
    color, x, 0.575, z,
    levelGroup
  );

  obstacles.push({
    x,
    z,
    width: 1.5,
    depth: 1,
    mesh: obstacle
  });
}

/* TẠO CỔNG */

function makeGate() {
  const color = level === 4 ? 0x9b263f : 0xb88b45;

  box(0.5, 4, 0.6, color, -2, 2, gatePosition, levelGroup);
  box(0.5, 4, 0.6, color, 2, 2, gatePosition, levelGroup);
  box(4.5, 0.6, 0.6, color, 0, 4, gatePosition, levelGroup);

  gate = box(
    3.4, 3.4, 0.25,
    level === 4 ? 0x4b2639 : 0x68462c,
    0, 1.7, gatePosition,
    levelGroup
  );
}

/* DỰNG BẢN ĐỒ */

function buildLevel() {
  scene.remove(levelGroup);
  levelGroup = new THREE.Group();
  scene.add(levelGroup);

  obstacles = [];

  const data = levels[level];

  scene.background = new THREE.Color(data.sky);
  scene.fog.color.set(data.sky);

  const ground = new THREE.Mesh(
    new THREE.BoxGeometry(28, 0.5, 65),
    material(data.ground)
  );
  ground.position.set(0, -0.3, -10);
  ground.receiveShadow = true;
  levelGroup.add(ground);

  // Đường đi
  box(7, 0.08, 60, 0xc6ae83, 0, 0, -10, levelGroup);

  // Cây hai bên đường
  for (let z = 5; z > -35; z -= 5) {
    makeTree(-9, z, data.tree);
    makeTree(9, z, data.tree);
  }

  // Chướng ngại vật
  makeObstacle(-1.8, -5, data.obstacle);
  makeObstacle(1.8, -11, data.obstacle);
  makeObstacle(-1.5, -16, data.obstacle);

  makeGate();

  // Vị trí hoàng tử
  prince.position.set(0, 0, 8);

  if (level === 4) {
    // Công chúa phía sau cổng
    const princess = new THREE.Group();

    sphere(0.3, 0xffd0a3, 0, 2, -28, princess);
    sphere(0.34, 0x8c492d, 0, 2.2, -28, princess);
    box(0.65, 1, 0.35, 0xe78caf, 0, 1.1, -28, princess);
    box(0.6, 0.15, 0.4, 0xffd447, 0, 2.35, -28, princess);

    levelGroup.add(princess);
  }

  document.getElementById("level").textContent = level + 1;
  document.getElementById("hint").textContent =
    data.name + " - Hãy tìm đường đến cánh cổng!";
}

buildLevel();

/* ĐIỀU KHIỂN */

const keys = {};

window.addEventListener("keydown", e => {
  keys[e.code] = true;

  if (e.code === "Space") e.preventDefault();

  if (e.code === "KeyE") interact();
});

window.addEventListener("keyup", e => {
  keys[e.code] = false;
});

let velocityY = 0;
let jumping = false;
const clock = new THREE.Clock();

function isBlocked(x, z, y) {
  if (y > 1.15) return false;

  return obstacles.some(o =>
    Math.abs(x - o.x) < 1.15 &&
    Math.abs(z - o.z) < 1.0
  );
}

function updatePlayer(dt) {
  let speed = 7 * dt;

  let dx = 0;
  let dz = 0;

  if (keys.KeyW || keys.ArrowUp) dz -= speed;
  if (keys.KeyS || keys.ArrowDown) dz += speed;
  if (keys.KeyA || keys.ArrowLeft) dx -= speed;
  if (keys.KeyD || keys.ArrowRight) dx += speed;

  const nextX = THREE.MathUtils.clamp(
    prince.position.x + dx, -5, 5
  );

  const nextZ = THREE.MathUtils.clamp(
    prince.position.z + dz, -29, 12
  );

  if (!isBlocked(nextX, prince.position.z, prince.position.y)) {
    prince.position.x = nextX;
  }

  if (!isBlocked(prince.position.x, nextZ, prince.position.y)) {
    prince.position.z = nextZ;
  }

  if (keys.Space && !jumping) {
    velocityY = 9;
    jumping = true;
  }

  velocityY -= 22 * dt;
  prince.position.y += velocityY * dt;

  if (prince.position.y <= 0) {
    prince.position.y = 0;
    velocityY = 0;
    jumping = false;
  }

  if (dx !== 0 || dz !== 0) {
    body.rotation.y = Math.atan2(-dx, -dz);
  }
}

/* CAMERA THEO SAU NHÂN VẬT */

function updateCamera() {
  const target = new THREE.Vector3(
    prince.position.x,
    prince.position.y + 4,
    prince.position.z + 8
  );

  camera.position.lerp(target, 0.08);

  camera.lookAt(
    prince.position.x,
    prince.position.y + 1.4,
    prince.position.z - 3
  );
}

/* CÂU HỎI */

function interact() {
  if (document.getElementById("quiz").style.display === "flex") {
    return;
  }

  if (Math.abs(prince.position.z - gatePosition) < 3) {
    openQuiz();
  }
}

function openQuiz() {
  const q = questions[level];

  document.getElementById("question-title").textContent = q.title;
  document.getElementById("question").textContent = q.q;
  document.getElementById("message").textContent = "";

  const container = document.getElementById("answers");
  container.innerHTML = "";

  q.a.forEach((answer, i) => {
    const btn = document.createElement("button");
    btn.className = "answer";
    btn.textContent = answer;

    btn.onclick = () => checkAnswer(i);

    container.appendChild(btn);
  });

  document.getElementById("quiz").style.display = "flex";
}

function checkAnswer(index) {
  const q = questions[level];

  if (index === q.correct) {
    document.getElementById("message").textContent =
      "Chính xác! Cánh cổng đã mở.";

    gate.visible = false;

    setTimeout(() => {
      document.getElementById("quiz").style.display = "none";

      if (level === 4) {
        document.getElementById("ending").style.display = "flex";
      } else {
        level++;
        buildLevel();
      }
    }, 1000);

  } else {
    document.getElementById("message").textContent =
      "Chưa chính xác! Hãy thử lại nhé.";
  }
}

/* VÒNG LẶP GAME */

function animate() {
  requestAnimationFrame(animate);

  const dt = Math.min(clock.getDelta(), 0.04);

  if (document.getElementById("quiz").style.display !== "flex" &&
      document.getElementById("ending").style.display !== "flex") {
    updatePlayer(dt);
  }

  updateCamera();

  const nearGate =
    Math.abs(prince.position.z - gatePosition) < 3;

  if (nearGate) {
    document.getElementById("hint").textContent =
      "Nhấn E để giải câu đố và mở cổng!";
  }

  renderer.render(scene, camera);
}

animate();

/* THAY ĐỔI KÍCH THƯỚC MÀN HÌNH */

window.addEventListener("resize", () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();

  renderer.setSize(window.innerWidth, window.innerHeight);
});
</script>

</body>
</html>
